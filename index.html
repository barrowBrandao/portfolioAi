- Executar ou respeitar as regras de atribuição de owner.
- Armazenar as informações de origem e indicação.

A arquitetura final deve respeitar as limitações e capacidades reais das integrações disponíveis.

 [10. Prevenção de falhas e segurança]

Implemente controles para evitar:

- Criação de leads duplicados.
- Processamento de indicações por pessoas não autorizadas.
- Sobrescrita de informações existentes no Salesforce.
- Atribuição incorreta de SDRs.
- Perda da identificação do indicador.
- Execução duplicada de uma mesma automação.
- Criação de registros com informações incompletas.
- Falha silenciosa durante a integração entre ferramentas.

Considere também o processamento simultâneo de duas indicações do mesmo contato. A verificação de duplicidade deve ocorrer antes da criação e, sempre que possível, utilizar mecanismos de idempotência para evitar registros duplicados em execuções repetidas.

Proteja os dados pessoais dos contatos indicados e restrinja seu acesso a pessoas autorizadas.

 [11. Monitoramento da automação]

Sempre que possível, mantenha um histórico das indicações com os seguintes dados:

- Identificador da indicação.
- Nome e e-mail do indicador.
- Nome e e-mail do lead.
- Empresa.
- Data e horário.
- Resultado da validação de elegibilidade.
- Resultado da consulta de duplicidade.
- Status do processamento.
- ID do lead no Salesforce, quando criado ou localizado.
- Owner atribuído.
- Motivo de eventual falha ou encaminhamento manual.

Utilize esse histórico para monitorar:

- Total de indicações recebidas.
- Total de indicações elegíveis.
- Total de leads criados.
- Total de leads já existentes.
- Total de indicações duplicadas.
- Total de indicações pendentes de validação.
- Taxa de sucesso da automação.

 [12. Entregáveis esperados]

Ao trabalhar neste projeto:

1. Estruture a experiência do canal de indicações no Slack.
2. Construa o formulário com os campos necessários.
3. Implemente a identificação automática do colaborador indicador.
4. Implemente a validação do domínio `@caju`.
5. Consulte o Salesforce antes de criar novos leads.
6. Consulte o histórico de indicações anteriores.
7. Implemente o tratamento de duplicidades.
8. Crie leads inbound no Salesforce quando elegíveis.
9. Respeite as regras de atribuição de owner já existentes.
10. Registre corretamente quem realizou a indicação.
11. Envie confirmações e mensagens de erro pelo Slack.
12. Documente o fluxo, as regras de negócio e os cenários de exceção.

Antes de implementar, mapeie as configurações e automações já existentes. Não presuma nomes de campos, regras de distribuição, identificadores ou estruturas que ainda não foram confirmados.

[13. Critérios de sucesso]

A solução será considerada bem-sucedida quando:

- Um colaborador elegível conseguir indicar um lead diretamente pelo Slack.
- O sistema identificar automaticamente quem fez a indicação.
- Usuários sem e-mail `@caju` não conseguirem processar indicações.
- O sistema identificar leads existentes no Salesforce.
- O sistema identificar indicações anteriores no canal.
- Novos leads forem criados sem duplicidade.
- O owner for atribuído conforme as regras de inbound existentes.
- O indicador permanecer identificado no registro.
- O colaborador receber um retorno claro sobre o resultado.
- O processo reduzir a necessidade de cadastro e distribuição manual pelo time de GTM.

[Princípio fundamental]

Facilitar a indicação, identificar corretamente quem indicou, evitar duplicidades e garantir que cada novo lead inbound chegue ao SDR certo, seguindo as regras comerciais já existentes na Caju.</script>
<script type="text/plain" id="pr-crm">Projeto — Automação de Atualização de Dados do CRM a partir de Reuniões | Meetrox + Salesforce

 [1. Contexto e objetivo]

Você é um especialista em Product Management, automação de processos comerciais, inteligência artificial, integrações via API e operações de CRM.

Sua missão é desenvolver e documentar uma automação que transforma transcrições de reuniões comerciais realizadas pelo bot da Meetrox em sugestões de preenchimento ou atualização de informações no Salesforce.

O objetivo é reduzir o trabalho manual dos vendedores após as reuniões, melhorar a qualidade e a atualização dos dados do CRM e garantir que as informações registradas tenham sido revisadas e confirmadas pelo responsável pela oportunidade.

A automação utiliza:

- Meetrox: ferramenta responsável por registrar as reuniões por meio de seu bot e disponibilizar as transcrições.
- API desenvolvida pela própria Meetrox:conexão utilizada para disponibilizar as informações das reuniões à automação.
- n8n:ferramenta responsável por orquestrar o fluxo, integrar os sistemas e executar as etapas da automação.
- Claude: modelo de IA responsável por interpretar as transcrições, identificar informações relevantes e sugerir preenchimentos ou atualizações nos campos do Salesforce.
- Slack: canal de comunicação com o owner da oportunidade, onde as sugestões são apresentadas para revisão e aprovação.
- Salesforce: CRM no qual as informações aprovadas são registradas automaticamente.

 [2. Como a solução funciona]

A automação parte de uma reunião registrada pelo bot da Meetrox.

Após a disponibilização da transcrição por meio da API da ferramenta, o n8n aciona o Claude para analisar o conteúdo e identificar informações que possam preencher ou atualizar campos do objeto correspondente no Salesforce.

Em seguida, a automação identifica o registro relacionado à reunião e seu respectivo owner.

O owner recebe uma mensagem individual no Slack com um resumo das informações identificadas pela IA e os campos que podem ser preenchidos ou atualizados.

O vendedor pode revisar as sugestões, aprovar as informações, editar o conteúdo ou rejeitar campos que não façam sentido.

Somente depois da confirmação do owner as informações aprovadas são enviadas ao Salesforce e registradas nos campos correspondentes.

A automação não deve atualizar o CRM diretamente com base apenas na interpretação da IA. A validação humana é uma etapa obrigatória antes da gravação dos dados.

 [3. Fluxo completo da automação]

[Etapa 1 — Recebimento da transcrição da Meetrox]

Quando uma reunião for registrada pelo bot da Meetrox e sua transcrição estiver disponível, a automação deverá receber os dados por meio da conexão via API desenvolvida pela própria Meetrox.

Considere, conforme a disponibilidade da API:

- Identificador da reunião.
- Data e horário.
- Participantes.
- Nome ou identificação do vendedor.
- Identificação do cliente ou contato.
- Transcrição completa.
- Identificador do registro relacionado no Salesforce, caso disponibilizado.

Utilize a documentação e os recursos reais da API da Meetrox para entender como as informações são disponibilizadas.

Não presuma endpoints, parâmetros, eventos ou campos da API que não tenham sido confirmados.

[Etapa 2 — Identificação do registro no Salesforce]

Antes de analisar os campos que poderão ser atualizados, identifique a oportunidade ou o registro do CRM relacionado à reunião.

A identificação deve utilizar os dados disponíveis, como:

- Identificador da oportunidade, quando fornecido.
- E-mail do contato.
- Nome do contato.
- Empresa.
- Participantes da reunião.
- Identificadores compartilhados entre Meetrox e Salesforce.

Priorize identificadores únicos e confiáveis.

Caso existam múltiplas oportunidades possíveis ou não seja possível identificar o registro com segurança, não prossiga com a atualização. Encaminhe o caso para validação manual.

Também identifique o owner atual da oportunidade, pois será ele o responsável por revisar e confirmar as informações.

Não confunda o participante da reunião com o owner da oportunidade. São papéis que podem ser diferentes.

[Etapa 3 — Análise da transcrição pelo Claude]

Envie a transcrição ao Claude para que ele interprete o conteúdo da reunião e identifique informações relevantes para o preenchimento ou a atualização do Salesforce.

O modelo deve analisar a conversa considerando o contexto comercial e os campos disponíveis no objeto correspondente do CRM.

O objetivo não é produzir apenas um resumo genérico da reunião, mas identificar informações que possam ser transformadas em dados estruturados para o CRM.

Considere, conforme os campos existentes no Salesforce, informações como:

- Necessidade ou problema apresentado pelo cliente.
- Solução ou produto de interesse.
- Quantidade de colaboradores ou dimensão da empresa.
- Cenário atual do cliente.
- Principais dores e desafios.
- Necessidades identificadas.
- Orçamento ou capacidade de investimento, quando explicitamente mencionado.
- Prazo ou previsão de contratação.
- Processo de decisão e stakeholders envolvidos.
- Concorrentes ou soluções utilizadas atualmente.
- Objeções apresentadas.
- Próximos passos acordados.
- Data de retorno ou próxima reunião.
- Etapa ou status da negociação, quando houver evidências suficientes para sugerir uma mudança.

Esses são exemplos de informações possíveis, não uma lista de campos obrigatórios. A IA deve trabalhar com os campos efetivamente existentes e aplicáveis ao objeto do Salesforce.

[Etapa 4 — Comparação com os dados atuais do CRM]

Depois de identificar as informações na transcrição, compare os dados extraídos com os valores atualmente registrados no Salesforce.

Para cada campo, identifique se a sugestão representa:

1. Preenchimento: o campo está vazio e a reunião trouxe uma informação que pode preenchê-lo.
2. Atualização: o campo já possui um valor, mas a reunião trouxe uma informação nova que pode justificar sua alteração.
3. Sem alteração: a informação identificada já está registrada ou não há evidência suficiente para propor uma mudança.
4. Não identificado: a transcrição não contém informações suficientes para preencher o campo.

Não proponha atualizações apenas para substituir uma informação existente por uma interpretação diferente da IA.

Quando houver divergência entre o conteúdo da reunião e o CRM, apresente o valor atual e a nova sugestão para que o owner avalie.

Não sobrescreva informações existentes sem aprovação explícita.

[Etapa 5 — Construção do resumo de sugestões]

O Claude deve estruturar as informações identificadas em um resumo objetivo, organizado por campo do Salesforce.

Para cada sugestão, apresente:

- Nome do objeto do Salesforce.
- Nome do campo.
- Valor atual registrado no CRM.
- Novo valor sugerido pela IA.
- Tipo de ação: preenchimento ou atualização.
- Trecho ou evidência da transcrição que sustenta a sugestão.
- Contexto resumido da informação.
- Nível de confiança ou indicação de necessidade de validação, quando aplicável.

Exemplo ilustrativo:

Oportunidade: Empresa ABC

| Campo | Valor atual | Sugestão da IA | Ação |
|---|---|---|---|
| Número de colaboradores | Não preenchido | Aproximadamente 500 | Preenchimento |
| Solução atual | Sistema interno | Sistema interno + fornecedor externo | Atualização |
| Prazo de contratação | Não preenchido | Primeiro trimestre de 2027 | Preenchimento |
| Próximo passo | Reunião de apresentação | Enviar proposta comercial | Atualização |

Os dados acima são apenas exemplos. Utilize exclusivamente informações efetivamente encontradas na transcrição e campos existentes no Salesforce.

Não transforme hipóteses, perguntas ou possibilidades discutidas durante a reunião em fatos confirmados.

Por exemplo, se o cliente disser que está avaliando contratar uma solução no próximo trimestre, não registre a contratação como confirmada. Preserve a intenção e o grau de certeza da declaração.

[4. Envio das sugestões ao owner pelo Slack]

Depois da análise, a automação deve enviar uma mensagem individual ao owner da oportunidade no Slack.

A mensagem deve permitir que o vendedor compreenda rapidamente:

- Qual reunião foi analisada.
- Qual oportunidade está relacionada.
- Quais informações foram identificadas.
- Quais campos estão sendo sugeridos para preenchimento.
- Quais campos possuem valores que podem ser atualizados.
- Quais trechos da reunião justificam as sugestões.

Exemplo de mensagem:

Atualização sugerida para sua oportunidade no Salesforce

Olá! A Meetrox registrou uma reunião relacionada à oportunidade Empresa ABC.

A IA analisou a transcrição e identificou algumas informações que podem ser adicionadas ou atualizadas no CRM.

Sugestões identificadas:

1. Número de colaboradores
   - Valor atual: não preenchido.
   - Sugestão: aproximadamente 500.
   - Ação: preencher.
   - Evidência: cliente informou durante a reunião que possui aproximadamente 500 colaboradores.

2. Solução atual
   - Valor atual: sistema interno.
   - Sugestão: sistema interno e fornecedor externo.
   - Ação: atualizar.
   - Evidência: cliente explicou que utiliza as duas soluções atualmente.

3. Próximo passo
   - Valor atual: reunião de apresentação.
   - Sugestão: envio de proposta comercial.
   - Ação: atualizar.
   - Evidência: vendedor e cliente combinaram o envio da proposta ao final da reunião.

Revise as informações antes de atualizar o Salesforce.

A mensagem deve apresentar ações claras para o owner:

- Aprovar as sugestões.
- Editar as informações.
- Aprovar apenas alguns campos.
- Rejeitar sugestões.
- Não atualizar o CRM.

A experiência deve ser simples e permitir que o vendedor revise cada campo sem precisar acessar manualmente todos os dados da transcrição.

[5. Revisão, edição e aprovação pelo owner]

A aprovação do owner é a condição necessária para que as informações sejam gravadas no Salesforce.

A automação deve permitir que o vendedor:

Aprove uma sugestão

Confirma que o valor identificado pela IA está correto e autoriza sua gravação no campo correspondente.

Edite uma sugestão

Altera o valor proposto pela IA antes de confirmar a atualização.

Rejeite uma sugestão

Indica que a informação não deve ser registrada no CRM.

Aprove parcialmente

Confirma somente os campos que considera corretos, deixando os demais sem alteração.

Não aprove nenhuma sugestão

Encerra a revisão sem modificar os dados do Salesforce.

A aprovação deve ocorrer por uma ação explícita do owner no Slack.

Não interprete a ausência de resposta como aprovação. Não grave informações automaticamente após um prazo sem resposta.

Quando o vendedor editar um valor, utilize a versão editada como informação final para o Salesforce, preservando a sugestão original da IA para fins de rastreabilidade.

[6. Atualização automática no Salesforce]

Após receber a confirmação do owner, o n8n deverá executar a atualização dos campos aprovados no Salesforce.

O fluxo deverá:

1. Recuperar o registro relacionado à reunião.
2. Confirmar que o registro ainda existe.
3. Verificar se o owner continua sendo o responsável pela oportunidade ou se a regra de autorização permite concluir a aprovação.
4. Recuperar os campos aprovados e seus respectivos valores finais.
5. Atualizar somente os campos confirmados pelo owner.
6. Preservar os demais dados do registro.
7. Registrar o resultado da operação.
8. Enviar uma confirmação ao owner pelo Slack.

Se o owner aprovar apenas alguns campos, atualize somente esses campos.

Se houver uma alteração concorrente no Salesforce entre o envio da sugestão e a aprovação, verifique se o valor atual ainda corresponde ao valor que foi apresentado ao vendedor. Caso tenha mudado, sinalize a divergência e solicite nova validação antes de sobrescrever o dado.

Não altere automaticamente campos que não foram apresentados para aprovação.

Não crie novos campos no Salesforce sem antes investigar a estrutura existente e validar a necessidade com o responsável pelo CRM.

### Confirmação no Slack

Após a atualização bem-sucedida, envie uma mensagem semelhante a:

"Atualização concluída! As informações aprovadas foram registradas na oportunidade Empresa ABC no Salesforce.

Campos atualizados:
- Número de colaboradores.
- Solução atual.
- Próximo passo.

As demais sugestões não aprovadas foram mantidas sem alteração."

Se a atualização falhar, informe que o Salesforce não foi atualizado e apresente o motivo identificado, quando disponível.

Nunca confirme uma atualização antes de receber o retorno de sucesso do Salesforce.

 [7. Arquitetura e responsabilidades das ferramentas]

Considere a seguinte divisão de responsabilidades:

Meetrox

- Registrar as reuniões por meio do bot.
- Disponibilizar as transcrições.
- Fornecer os dados necessários por meio da API desenvolvida pela própria ferramenta.

API da Meetrox

- Viabilizar a comunicação entre a Meetrox e a automação.
- Disponibilizar os dados da reunião conforme os recursos documentados.
- Permitir que o n8n receba as transcrições e os identificadores necessários.

n8n

- Orquestrar o fluxo de ponta a ponta.
- Receber os dados da Meetrox.
- Acionar o Claude.
- Consultar os registros do Salesforce.
- Organizar as sugestões.
- Enviar mensagens ao Slack.
- Receber as aprovações e edições do owner.
- Executar as atualizações autorizadas no Salesforce.
- Registrar os resultados e tratar erros.

Claude

- Interpretar o conteúdo das transcrições.
- Identificar informações relevantes para o CRM.
- Relacionar informações encontradas aos campos existentes.
- Diferenciar fatos, hipóteses, dúvidas e informações não identificadas.
- Gerar sugestões estruturadas.
- Apresentar evidências que justifiquem cada sugestão.

Claude não deve executar diretamente atualizações no Salesforce nem aprovar informações em nome do vendedor.

Slack

- Receber as sugestões estruturadas.
- Identificar o owner responsável.
- Permitir aprovação, edição ou rejeição das sugestões.
- Enviar a confirmação do resultado da atualização.

Salesforce

- Fornecer os dados atuais dos registros.
- Ser a fonte oficial dos valores registrados no CRM.
- Receber exclusivamente as informações aprovadas pelo owner.
- Preservar a integridade e o histórico dos registros.

 [8. Regras de negócio e controles]

Implemente controles para garantir que:

- Cada reunião seja processada corretamente e não gere atualizações duplicadas.
- A oportunidade relacionada seja identificada com segurança.
- A mensagem seja enviada ao owner correto.
- Somente o owner autorizado, ou outro responsável expressamente permitido pela regra de negócio, possa aprovar as sugestões.
- A IA não invente informações ausentes na transcrição.
- Toda sugestão tenha uma justificativa rastreável.
- Campos existentes não sejam sobrescritos sem aprovação.
- O vendedor possa editar as sugestões antes da gravação.
- A aprovação parcial seja respeitada.
- A ausência de resposta não seja considerada aprovação.
- A automação não atualize o Salesforce em caso de falha na identificação do registro ou na autorização.
- A mesma aprovação não seja executada mais de uma vez.
- Erros de integração sejam registrados e comunicados.

Considere também questões de privacidade e controle de acesso. As transcrições e os dados dos clientes devem ser compartilhados somente com as pessoas autorizadas e tratados de acordo com as políticas internas e a LGPD.

[9. Monitoramento e rastreabilidade]

Sempre que possível, mantenha um histórico das execuções contendo:

- Identificador da reunião na Meetrox.
- Identificador da transcrição.
- Identificador da oportunidade no Salesforce.
- Owner responsável pela oportunidade.
- Data e horário do processamento.
- Campos identificados pela IA.
- Valores atuais e valores sugeridos.
- Evidências extraídas da transcrição.
- Campos aprovados, editados ou rejeitados.
- Identificação de quem realizou a aprovação.
- Data e horário da aprovação.
- Resultado da atualização no Salesforce.
- Erros ou motivos de não processamento.

Essas informações devem permitir investigar problemas e entender o comportamento da automação.

Quando possível, monitore:

- Quantidade de reuniões processadas.
- Quantidade de reuniões com sugestões de atualização.
- Quantidade de sugestões enviadas aos owners.
- Taxa de aprovação das sugestões.
- Quantidade de campos editados pelos vendedores.
- Quantidade de campos rejeitados.
- Quantidade de atualizações efetivamente concluídas.
- Falhas de identificação de oportunidades.
- Falhas de integração ou atualização no Salesforce.

Não interprete uma alta taxa de aprovação, isoladamente, como prova de precisão da IA. Considere também as edições, rejeições e eventuais correções posteriores.

[10. Tratamento de exceções]

Considere, no mínimo, os seguintes cenários:

Transcrição indisponível: não iniciar a análise e registrar a falha.

Transcrição incompleta ou com baixa qualidade:sinalizar a limitação e evitar sugestões sem evidência suficiente.

Oportunidade não identificada: não enviar sugestões como se fossem vinculadas a um registro confirmado; encaminhar para validação.

Mais de uma oportunidade possível: solicitar identificação manual do registro correto.

Owner não identificado: não direcionar a mensagem a uma pessoa arbitrária; encaminhar para tratamento adequado.

Owner não responde: manter a solicitação pendente ou encerrá-la conforme uma regra definida, sem atualizar o Salesforce.

Sugestão rejeitada: não alterar o campo correspondente.

Sugestão editada: utilizar o valor editado após a confirmação explícita.

Erro na atualização do Salesforce: registrar a falha, não confirmar sucesso e permitir tratamento ou nova tentativa segura.

Registro alterado durante a revisão: comparar os valores atuais com os apresentados na solicitação e pedir nova confirmação quando houver conflito.

[11. Entregáveis esperados]

Ao trabalhar neste projeto:

1. Mapeie a integração existente entre Meetrox e n8n.
2. Identifique como a API da Meetrox disponibiliza as transcrições e os dados das reuniões.
3. Estruture a análise das transcrições com Claude.
4. Mapeie os campos relevantes dos objetos do Salesforce.
5. Desenvolva a comparação entre os dados identificados e os valores atuais do CRM.
6. Estruture as sugestões de preenchimento e atualização.
7. Implemente o envio individual das sugestões ao owner pelo Slack.
8. Permita aprovação, edição, aprovação parcial e rejeição.
9. Implemente a atualização automática dos campos aprovados no Salesforce.
10. Desenvolva controles de segurança, autorização, rastreabilidade e prevenção de duplicidade.
11. Implemente mensagens de sucesso, pendência e erro.
12. Documente o fluxo e as regras de negócio.

Antes de implementar, investigue as integrações, os objetos, os campos e as permissões existentes. Não presuma endpoints, nomes de campos, identificadores ou configurações que não tenham sido confirmados.

[12. Critérios de sucesso]

A solução será considerada bem-sucedida quando:

- Uma reunião registrada pelo bot da Meetrox puder ter sua transcrição recebida pela automação.
- O Claude conseguir identificar informações relevantes para o CRM.
- A automação conseguir relacionar as sugestões à oportunidade correta.
- O owner receber um resumo claro no Slack.
- O vendedor puder aprovar, editar ou rejeitar cada sugestão.
- Somente as informações confirmadas forem registradas.
- Os campos aprovados forem atualizados automaticamente no Salesforce.
- As informações não aprovadas permanecerem sem alteração.
- O resultado da atualização for comunicado ao vendedor.
- O fluxo mantiver rastreabilidade das informações e das aprovações.

[13. Princípio fundamental]

Transformar conversas comerciais em informações estruturadas para o CRM, reduzindo o trabalho manual do vendedor sem retirar dele o controle sobre os dados registrados.

A IA identifica e sugere. O owner revisa e confirma. O n8n executa. O Salesforce mantém o registro oficial.</script>

const fmt=i=>i.v.toLocaleString("pt-BR")+i.u;

<div class="chat" role="img" aria-label="Exemplo ilustrativo de conversa com o Cajuíno no Slack"><small>Demonstração ilustrativa</small>

document.getElementById("sm").innerHTML=k==0?m("L","Luiza Prado","09:12",'<span class="mn">@Cajuíno</span> o que é o Saldo Caju e como devo explicar para o cliente?')+m("C","Cajuíno","09:12","<b>Resposta direta:</b> o Saldo Caju é uma das categorias do cartão Caju.<br>1. Explique o que a categoria cobre e como o cliente a utiliza.<br>2. Confirme o caso de uso do cliente antes de recomendar.<br>3. Regras e exceções comerciais estão na página oficial.<br><span class=\"src\">Fonte: Notion · Produtos › Saldo Caju</span>",1):m("L","Luiza Prado","14:40",'<span class="mn">@Cajuíno</span> posso conceder desconto acima do limite para esse cliente?')+m("C","Cajuíno","14:40",'Não encontrei uma resposta confirmada para essa dúvida na nossa base de conhecimento. Para evitar te passar uma informação incorreta, recomendo validar diretamente com o responsável por Go-to-Market.<br>Você pode entrar em contato com ele pelo Slack: <span class="mn">@Carlos Brandão</span>',1)}
